<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Auto Short Video</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(1000px 600px at 20% 10%,#7c3aed33,transparent),radial-gradient(800px 500px at 90% 90%,#06b6d433,transparent),#0f172a;color:#e2e8f0;padding:20px}
.card{width:100%;max-width:380px;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:32px;box-shadow:0 20px 60px #0008}
.logo{text-align:center;margin-bottom:20px}
.logo span{font-size:40px}
h2{text-align:center;margin-bottom:6px}
.sub{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:20px}
label{display:block;font-size:13px;color:#94a3b8;margin:12px 0 6px}
input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none}
input:focus{border-color:#7c3aed}
button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:linear-gradient(90deg,#7c3aed,#06b6d4);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
button:hover{opacity:.9}
.error{background:#7f1d1d;border:1px solid #ef4444;color:#fecaca;padding:10px;border-radius:10px;font-size:14px;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><span>🎬</span></div>
  <h2>Auto Short Video</h2>
  <p class="sub">Inicia sesión para crear tus shorts</p>
  {% if login_error %}<div class="error">{{ login_error }}</div>{% endif %}
  <form method="POST">
    <label>Usuario</label>
    <input type="text" name="username" placeholder="tu_usuario" required>
    <label>Contraseña</label>
    <input type="password" name="password" placeholder="••••••••" required>
    <button type="submit">Ingresar</button>
  </form>
</div>
</body>
</html>
